services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: baha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_SUPER_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # DB bootstrap — runs once on an empty data volume, in numeric order.
      - ./db/setup.sql:/docker-entrypoint-initdb.d/01_setup.sql:ro
      - ./db/user_creation.sql:/docker-entrypoint-initdb.d/02_user_creation.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d baha"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8083:8083"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8083
      CUSTOM_DB_URL: jdbc:postgresql://db:5432/baha
      CUSTOM_DB_USER: baha_user
      CUSTOM_DB_PASS: Password123!
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-32char-plus-secret}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      BAHA_CORS_ALLOWED_ORIGINS: ${BAHA_CORS_ALLOWED_ORIGINS:-http://localhost:*}
      BAHA_PUBLIC_BASE_URL: ${BAHA_PUBLIC_BASE_URL:-https://floodedarea.com}
      # Social auto-post (admin/system reports → Facebook Page + X). Both switches default to the
      # safe setting, so deploying this file never starts publishing on its own: SOCIAL_ENABLED must
      # be turned on deliberately, and SOCIAL_DRY_RUN left at true logs the payload instead of
      # calling the network. Tokens come from .env — never commit real values.
      SOCIAL_ENABLED: ${SOCIAL_ENABLED:-false}
      SOCIAL_DRY_RUN: ${SOCIAL_DRY_RUN:-true}
      SOCIAL_MAX_ATTEMPTS: ${SOCIAL_MAX_ATTEMPTS:-3}
      SOCIAL_API_BASE_URL: ${SOCIAL_API_BASE_URL:-}
      FB_PAGE_ID: ${FB_PAGE_ID:-}
      FB_PAGE_TOKEN: ${FB_PAGE_TOKEN:-}
      FB_GRAPH_VERSION: ${FB_GRAPH_VERSION:-v21.0}
      X_API_KEY: ${X_API_KEY:-}
      X_API_SECRET: ${X_API_SECRET:-}
      X_ACCESS_TOKEN: ${X_ACCESS_TOKEN:-}
      X_ACCESS_SECRET: ${X_ACCESS_SECRET:-}

volumes:
  postgres_data:
