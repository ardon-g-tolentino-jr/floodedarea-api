# Database Connection (local dev)
spring.datasource.url=jdbc:postgresql://localhost:5432/baha
spring.datasource.username=baha_user
spring.datasource.password=Password123!
spring.datasource.hikari.connection-init-sql=SET search_path TO baha

# JPA / Hibernate Settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (dev only — 32+ char secret; rotate for prod). 30-day lifetime (see application.properties).
jwt.secret=b8c1e2a4f6d0937c5e1a9b4d2c6f8e0a3b5d7c9e1f2a4b6c8d0e2f4a6b8c0d2e4
jwt.expiration-ms=2592000000

# Google SSO — same OAuth Web client ID the front-end uses (VITE_GOOGLE_CLIENT_ID).
# The /auth/google verifier requires the ID token's `aud` claim to equal this value.
google.client-id=1002322633665-4vflr39l41uqh3o1vhv5b46ukepc0d16.apps.googleusercontent.com

# Server (8083 — avoids vault-api on 8082)
server.port=8083

# CORS — the Vite dev server
baha.cors.allowed-origins=http://localhost:*
