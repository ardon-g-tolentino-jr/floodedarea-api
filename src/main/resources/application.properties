spring.application.name=baha-api

server.forward-headers-strategy=FRAMEWORK
server.port=${SERVER_PORT:8083}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.properties.hibernate.default_schema=baha

# Database Connection
spring.datasource.url=${CUSTOM_DB_URL}
spring.datasource.username=${CUSTOM_DB_USER}
spring.datasource.password=${CUSTOM_DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET search_path TO baha

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# JWT (self-issued; secret MUST be 32+ chars)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Google SSO — the OAuth 2.0 Web client ID. The API verifies that every Google
# ID token it accepts was minted for THIS client (the `aud` claim must match).
google.client-id=${GOOGLE_CLIENT_ID:}

# CORS — comma-separated allowed origin patterns for the baha-ui front-end.
baha.cors.allowed-origins=${BAHA_CORS_ALLOWED_ORIGINS:http://localhost:*}

# Per-IP rate limits (requests/minute; 0 = unlimited) for abuse-prone endpoints.
baha.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
baha.rate-limit.login-per-min=${RATE_LIMIT_LOGIN_PER_MIN:10}
baha.rate-limit.google-per-min=${RATE_LIMIT_GOOGLE_PER_MIN:10}
baha.rate-limit.register-per-min=${RATE_LIMIT_REGISTER_PER_MIN:5}
baha.rate-limit.report-per-min=${RATE_LIMIT_REPORT_PER_MIN:20}
baha.rate-limit.rescue-per-min=${RATE_LIMIT_RESCUE_PER_MIN:6}

# Cloudflare Turnstile — secret key to verify no-login GUEST flood reports. Leave blank to
# disable CAPTCHA (guest reporting still works; must match the UI's VITE_TURNSTILE_SITE_KEY).
turnstile.secret-key=${TURNSTILE_SECRET_KEY:}

# Geofence — accepted report coordinates must fall inside this bbox (Metro Manila + Rizal).
baha.geofence.enabled=${GEOFENCE_ENABLED:true}
baha.geofence.min-lat=${GEOFENCE_MIN_LAT:14.2}
baha.geofence.max-lat=${GEOFENCE_MAX_LAT:15.0}
baha.geofence.min-lng=${GEOFENCE_MIN_LNG:120.8}
baha.geofence.max-lng=${GEOFENCE_MAX_LNG:121.5}

# Flood-news incident drafter — scheduled job that turns PH flood news into pending draft incidents
# for the admin inbox. OFF by default: the /incidents review API works without it; flip the switch
# only where outbound calls to Google News RSS are acceptable. interval-ms is the poll cadence.
baha.incidents.ingest.enabled=${INCIDENT_INGEST_ENABLED:false}
baha.incidents.ingest.interval-ms=${INCIDENT_INGEST_INTERVAL_MS:900000}
baha.incidents.ingest.initial-delay-ms=${INCIDENT_INGEST_INITIAL_DELAY_MS:60000}
baha.incidents.ingest.query=${INCIDENT_INGEST_QUERY:flood (Metro Manila OR Rizal OR Marikina OR NCR) when:1d}
baha.incidents.ingest.max-per-run=${INCIDENT_INGEST_MAX_PER_RUN:15}
baha.incidents.ingest.min-confidence=${INCIDENT_INGEST_MIN_CONFIDENCE:0.0}
